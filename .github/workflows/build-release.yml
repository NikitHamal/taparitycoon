name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/tapari-release.jks" \
            -storepass tapari-ci-pass -keypass tapari-ci-pass -alias tapari \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tapari Tycoon, OU=Games, O=Tapari, L=Kathmandu, C=NP"

      - name: Build debug + signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/tapari-release.jks
          KEYSTORE_PASSWORD: tapari-ci-pass
          KEY_ALIAS: tapari
          KEY_PASSWORD: tapari-ci-pass
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapariTycoon-debug.apk
          cp app/build/outputs/apk/release/app-release.apk TapariTycoon-release.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TapariTycoon-apks
          path: |
            TapariTycoon-debug.apk
            TapariTycoon-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TapariTycoon-debug.apk TapariTycoon-release.apk \
            --target "${{ github.sha }}" --latest \
            --title "Momo & Chiya Empire - build ${{ github.run_number }}" \
            --notes "Automated build #${{ github.run_number }} from commit ${{ github.sha }}. Install TapariTycoon-release.apk on your Android phone."
