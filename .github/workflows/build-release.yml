name: Build & Release APK

# Runs only for pushes to main that touch the game, the build setup or this workflow.
# Docs / status / README changes and pull requests never trigger a build.
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'keystore/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify committed keystore
        run: keytool -list -keystore keystore/tapari-release.p12 -storetype PKCS12 -storepass tapari123 -alias tapari

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk TapariTycoon-release.apk
          ls -la TapariTycoon-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TapariTycoon-release
          path: TapariTycoon-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TapariTycoon-release.apk \
            --target "${{ github.sha }}" --latest \
            --title "Momo & Chiya Empire - build ${{ github.run_number }}" \
            --notes "Automated build #${{ github.run_number }} from commit ${{ github.sha }}. Install TapariTycoon-release.apk on your Android phone. Every build is signed with the same committed keystore, so updates install over older builds."
